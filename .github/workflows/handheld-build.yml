name: Handheld Windows build

on:
  push:
    branches: [handheld]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: handheld-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
      ARKE_CHANNEL: dev
      ARKE_RELEASES_REPO: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: handheld-windows
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check application
        run: cargo check -p arke-app --locked
      - name: Test handheld integration
        run: cargo test -p arke-app --locked handheld
      - name: Build Windows executable
        run: cargo build -p arke-app --bin arke --release --locked
      - name: Package development build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/release/arke.exe dist/arke.exe
          Copy-Item LICENSE,THIRD_PARTY_LICENSES.md,THIRD_PARTY_NOTICES.md dist/
          Copy-Item docs/handheld.md dist/HANDHELD.md
          "Commit: $env:GITHUB_SHA`nUnsigned development build; handheld hardware validation pending." | Set-Content dist/BUILD.txt
          (Get-FileHash dist/arke.exe -Algorithm SHA256).Hash | Set-Content dist/arke.exe.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Arke-Handheld-Windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14
